<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Snake // Cyber Grid</title>
  <style>
    :root {
      --bg-1: #07070f;
      --bg-2: #0e1030;
      --neon-cyan: #00f5ff;
      --neon-magenta: #ff2dd1;
      --neon-purple: #8a2bff;
      --neon-lime: #72ff4f;
      --text: #dffaff;
      --danger: #ff4b8a;
      --cell: 22;
      --grid: 20;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Orbitron", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 45, 209, 0.2), transparent 35%),
        radial-gradient(circle at 80% 75%, rgba(0, 245, 255, 0.2), transparent 30%),
        linear-gradient(145deg, var(--bg-1), #050510 45%, var(--bg-2));
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 245, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 255, 0.08) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      opacity: 0.35;
    }

    .frame {
      width: min(92vw, 630px);
      border: 1px solid rgba(0, 245, 255, 0.6);
      border-radius: 18px;
      padding: 18px;
      background: rgba(8, 10, 30, 0.62);
      backdrop-filter: blur(7px);
      box-shadow:
        0 0 18px rgba(0, 245, 255, 0.45),
        0 0 35px rgba(138, 43, 255, 0.28),
        inset 0 0 16px rgba(255, 45, 209, 0.2);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .title {
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px rgba(0, 245, 255, 0.8), 0 0 18px rgba(0, 245, 255, 0.4);
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.35);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .chip strong {
      color: var(--neon-magenta);
      text-shadow: 0 0 10px rgba(255, 45, 209, 0.55);
    }

    #game {
      width: calc(var(--cell) * var(--grid) * 1px);
      height: calc(var(--cell) * var(--grid) * 1px);
      max-width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      border: 1px solid rgba(114, 255, 79, 0.45);
      background:
        radial-gradient(circle at 30% 25%, rgba(0, 245, 255, 0.08), transparent 45%),
        linear-gradient(135deg, #070919, #0e0f24 60%, #121533);
      box-shadow:
        inset 0 0 12px rgba(114, 255, 79, 0.22),
        0 0 18px rgba(114, 255, 79, 0.18);
      display: block;
      margin: 0 auto;
    }

    .controls {
      margin-top: 12px;
      font-size: 0.85rem;
      opacity: 0.85;
      text-align: center;
    }

    .controls kbd {
      border: 1px solid rgba(0, 245, 255, 0.5);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 2px 6px;
      background: rgba(0, 0, 0, 0.35);
      color: var(--neon-cyan);
      font-family: inherit;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      pointer-events: none;
      padding: 30px;
    }

    .overlay-card {
      background: rgba(5, 7, 20, 0.72);
      border: 1px solid rgba(255, 45, 209, 0.6);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 0 22px rgba(255, 45, 209, 0.3);
      max-width: 80%;
    }

    .overlay h2 {
      margin: 0 0 8px;
      color: var(--neon-magenta);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 14px rgba(255, 45, 209, 0.65);
    }

    .overlay p {
      margin: 0;
      font-size: 0.92rem;
    }

    .playfield {
      position: relative;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="frame">
    <section class="hud">
      <div class="title">Snake // Neon City</div>
      <div class="stats">
        <div class="chip">Score: <strong id="score">0</strong></div>
        <div class="chip">High: <strong id="high">0</strong></div>
        <div class="chip">Speed: <strong id="speed">1x</strong></div>
      </div>
    </section>

    <section class="playfield">
      <canvas id="game" width="440" height="440" aria-label="Snake game board"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <h2>Press Space</h2>
          <p>Use Arrow keys / WASD to move.<br />Avoid walls and your tail.</p>
        </div>
      </div>
    </section>

    <p class="controls">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · <kbd>Space</kbd> pause/start · <kbd>R</kbd> restart
    </p>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');
    const speedEl = document.getElementById('speed');
    const overlay = document.getElementById('overlay');

    const gridSize = 20;
    const cell = canvas.width / gridSize;
    const STORAGE_KEY = 'cyberSnakeHighScore';

    let snake;
    let direction;
    let nextDirection;
    let food;
    let score;
    let highScore;
    let stepMs;
    let lastTime;
    let accumulator;
    let running;
    let paused;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { ...direction };
      food = placeFood();
      score = 0;
      stepMs = 145;
      lastTime = 0;
      accumulator = 0;
      running = false;
      paused = true;
      highScore = Number(localStorage.getItem(STORAGE_KEY) || 0);
      updateHud();
      showOverlay('Press Space', 'Use Arrow keys / WASD to move.<br />Avoid walls and your tail.');
      draw();
    }

    function placeFood() {
      while (true) {
        const candidate = {
          x: Math.floor(Math.random() * gridSize),
          y: Math.floor(Math.random() * gridSize)
        };
        if (!snake || !snake.some(seg => seg.x === candidate.x && seg.y === candidate.y)) {
          return candidate;
        }
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      highEl.textContent = highScore;
      const speedMult = (145 / stepMs).toFixed(1).replace('.0', '');
      speedEl.textContent = `${speedMult}x`;
    }

    function showOverlay(title, text) {
      overlay.innerHTML = `<div class="overlay-card"><h2>${title}</h2><p>${text}</p></div>`;
      overlay.classList.remove('hidden');
    }

    function hideOverlay() {
      overlay.classList.add('hidden');
    }

    function drawGridGlow() {
      ctx.save();
      ctx.strokeStyle = 'rgba(0, 245, 255, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 1; i < gridSize; i++) {
        const p = i * cell;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(canvas.width, p);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawFood() {
      const x = food.x * cell + cell / 2;
      const y = food.y * cell + cell / 2;
      const r = cell * 0.28;

      const grad = ctx.createRadialGradient(x, y, 2, x, y, r * 2.1);
      grad.addColorStop(0, '#fff4ff');
      grad.addColorStop(0.35, '#ff2dd1');
      grad.addColorStop(1, 'rgba(255,45,209,0.08)');

      ctx.save();
      ctx.fillStyle = grad;
      ctx.shadowColor = '#ff2dd1';
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawSnake() {
      snake.forEach((seg, i) => {
        const x = seg.x * cell;
        const y = seg.y * cell;
        const isHead = i === 0;
        const hue = isHead ? '#72ff4f' : '#00f5ff';

        ctx.save();
        ctx.fillStyle = hue;
        ctx.shadowColor = hue;
        ctx.shadowBlur = isHead ? 16 : 10;
        roundRect(ctx, x + 2, y + 2, cell - 4, cell - 4, 6);
        ctx.fill();
        ctx.restore();

        if (isHead) {
          ctx.save();
          ctx.fillStyle = '#081018';
          const eye = cell * 0.09;
          const ex1 = x + cell * 0.33;
          const ex2 = x + cell * 0.67;
          const ey = y + cell * 0.34;
          ctx.beginPath();
          ctx.arc(ex1, ey, eye, 0, Math.PI * 2);
          ctx.arc(ex2, ey, eye, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });
    }

    function roundRect(context, x, y, w, h, r) {
      context.beginPath();
      context.moveTo(x + r, y);
      context.lineTo(x + w - r, y);
      context.quadraticCurveTo(x + w, y, x + w, y + r);
      context.lineTo(x + w, y + h - r);
      context.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      context.lineTo(x + r, y + h);
      context.quadraticCurveTo(x, y + h, x, y + h - r);
      context.lineTo(x, y + r);
      context.quadraticCurveTo(x, y, x + r, y);
      context.closePath();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGridGlow();
      drawFood();
      drawSnake();
    }

    function step() {
      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

      const hitWall = head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize;
      const hitSelf = snake.some(seg => seg.x === head.x && seg.y === head.y);

      if (hitWall || hitSelf) {
        running = false;
        paused = true;
        showOverlay('Game Over', `Score: ${score}<br />Press <strong>R</strong> to restart`);
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        food = placeFood();
        stepMs = Math.max(72, stepMs - 3);
        if (score > highScore) {
          highScore = score;
          localStorage.setItem(STORAGE_KEY, String(highScore));
        }
      } else {
        snake.pop();
      }

      updateHud();
      draw();
    }

    function loop(timestamp) {
      if (!running) return;

      if (!lastTime) lastTime = timestamp;
      const delta = timestamp - lastTime;
      lastTime = timestamp;
      accumulator += delta;

      while (accumulator >= stepMs) {
        step();
        accumulator -= stepMs;
      }

      requestAnimationFrame(loop);
    }

    function setDirection(x, y) {
      if (x === -direction.x && y === -direction.y) return;
      nextDirection = { x, y };
    }

    function startPauseToggle() {
      if (!running && paused) {
        running = true;
        paused = false;
        hideOverlay();
        lastTime = 0;
        accumulator = 0;
        requestAnimationFrame(loop);
      } else if (running) {
        running = false;
        paused = true;
        showOverlay('Paused', 'Press <strong>Space</strong> to continue');
      }
    }

    function restart() {
      init();
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d','r'].includes(key)) {
        e.preventDefault();
      }

      switch (key) {
        case 'arrowup':
        case 'w':
          setDirection(0, -1);
          break;
        case 'arrowdown':
        case 's':
          setDirection(0, 1);
          break;
        case 'arrowleft':
        case 'a':
          setDirection(-1, 0);
          break;
        case 'arrowright':
        case 'd':
          setDirection(1, 0);
          break;
        case ' ':
          startPauseToggle();
          break;
        case 'r':
          restart();
          break;
      }
    });

    init();
  </script>
</body>
</html>
